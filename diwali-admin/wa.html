<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>WhatsApp — Art India</title>
<!--
  What the bot has been doing. Reads /api/wa-admin with the admin token kept
  in this browser, the same one the reply page uses.

  Plain HTML on purpose: it gets opened on a phone, on 4G, usually because
  something needs an answer now.
-->
<style>
  :root {
    color-scheme: light dark;
    --bg: #faf7f2; --card: #fff; --ink: #1b1714; --muted: #6b625a;
    --line: #e4ddd3; --accent: #b4381f; --ok: #1d6b45; --bad: #9c2323;
    --warm: #b47a1f; --in: #f0ebe3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17140f; --card: #211c16; --ink: #f2ece4; --muted: #a2988c;
      --line: #342c23; --accent: #e2673f; --ok: #5fc191; --bad: #f08a7c;
      --warm: #e0ad5a; --in: #2b2419;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 1rem .9rem 3rem; background: var(--bg); color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 46rem; margin: 0 auto; }
  header { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; margin-bottom: .9rem; }
  h1 { font-size: 1.15rem; margin: 0; flex: 1; }
  .pill {
    font-size: .72rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
    padding: .25rem .55rem; border-radius: 999px; border: 1px solid var(--line);
  }
  .pill.on  { color: var(--ok);  border-color: currentColor; }
  .pill.off { color: var(--bad); border-color: currentColor; }
  .pill.muted { color: var(--muted); }
  button, .btn {
    font: inherit; border: 1px solid var(--line); background: var(--card);
    color: inherit; border-radius: .5rem; padding: .5rem .8rem; cursor: pointer;
  }
  button:focus-visible, a:focus-visible, summary:focus-visible {
    outline: 3px solid var(--accent); outline-offset: 2px;
  }
  nav { display: flex; gap: .4rem; margin-bottom: .9rem; }
  nav button { flex: 1; font-weight: 600; font-size: .88rem; }
  nav button[aria-selected="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
  .row {
    background: var(--card); border: 1px solid var(--line); border-radius: .6rem;
    padding: .7rem .8rem; margin-bottom: .5rem;
  }
  .row.flag { border-left: 3px solid var(--accent); }
  .head { display: flex; gap: .5rem; align-items: baseline; flex-wrap: wrap; }
  .who { font-weight: 600; }
  .meta { color: var(--muted); font-size: .78rem; }
  .preview { color: var(--muted); font-size: .86rem; margin-top: .25rem;
             overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tag { font-size: .68rem; text-transform: uppercase; letter-spacing: .04em;
         padding: .1rem .4rem; border-radius: .3rem; border: 1px solid var(--line); color: var(--muted); }
  .tag.buyer { color: var(--ok); border-color: currentColor; }
  .tag.needs { color: var(--accent); border-color: currentColor; font-weight: 700; }
  .tag.failed { color: var(--bad); border-color: currentColor; }
  .tag.read { color: var(--ok); border-color: currentColor; }
  .tag.delivered { color: var(--warm); border-color: currentColor; }
  summary { cursor: pointer; list-style: none; }
  summary::-webkit-details-marker { display: none; }
  .log { margin-top: .7rem; border-top: 1px solid var(--line); padding-top: .6rem; }
  .line { margin-bottom: .5rem; font-size: .88rem; }
  .line .bubble {
    display: inline-block; padding: .4rem .6rem; border-radius: .5rem;
    max-width: 90%; white-space: pre-wrap; word-break: break-word;
  }
  .line.in  .bubble { background: var(--in); }
  .line.out .bubble { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .line .when { display: block; color: var(--muted); font-size: .7rem; margin-top: .15rem; }
  .actions { margin-top: .6rem; }
  .actions a { color: var(--accent); font-weight: 600; font-size: .85rem; }
  .counts { display: flex; gap: .4rem; flex-wrap: wrap; margin-bottom: .8rem; }
  .count-box {
    flex: 1; min-width: 4.5rem; background: var(--card); border: 1px solid var(--line);
    border-radius: .6rem; padding: .6rem; text-align: center;
  }
  .count-box b { display: block; font-size: 1.3rem; }
  .count-box span { color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; }
  .empty { color: var(--muted); text-align: center; padding: 2rem 1rem; }

  /* The welcome alarm and the backfill. Deliberately the loudest thing on the
     page: the failure this was built for hid behind a counter for weeks. */
  .alarm {
    border: 1px solid var(--bad); border-radius: .6rem; padding: .7rem .8rem;
    margin: 0 0 .8rem; color: var(--bad);
  }
  .alarm b { display: block; font-size: 1rem; margin-bottom: .25rem; }
  .alarm .why { color: var(--muted); font-size: .85rem; }
  .backfill { background: var(--card); border: 1px solid var(--line);
    border-radius: .6rem; padding: .7rem .8rem; margin: 0 0 .8rem; }
  .backfill .bar { height: .4rem; border-radius: .2rem; background: var(--line);
    margin: .5rem 0 .35rem; overflow: hidden; }
  .backfill .bar i { display: block; height: 100%; background: var(--accent); }
  .backfill button { font: inherit; padding: .5rem .9rem; border-radius: .4rem;
    cursor: pointer; border: 1px solid var(--line); background: var(--bg);
    color: var(--ink); margin-right: .4rem; }
  .backfill button.go { border-color: var(--accent); color: var(--accent); font-weight: 700; }
  .backfill button[disabled] { opacity: .5; cursor: default; }
  .backfill .note { color: var(--muted); font-size: .82rem; margin: .4rem 0 0; }
  table { width: 100%; border-collapse: collapse; font-size: .86rem; }
  th, td { text-align: left; padding: .4rem .5rem; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-size: .7rem; text-transform: uppercase; letter-spacing: .05em; font-weight: 700; }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
  .tbl-wrap { overflow-x: auto; background: var(--card); border: 1px solid var(--line);
              border-radius: .6rem; padding: .5rem .7rem; margin-bottom: .8rem; }
  .tbl-h { font-size: .8rem; font-weight: 700; margin: .2rem 0 .4rem; }
  .range { display: flex; gap: .35rem; margin-bottom: .8rem; flex-wrap: wrap; }
  .range button[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
  .field { margin-bottom: .8rem; }
  label { display: block; font-weight: 600; font-size: .85rem; margin-bottom: .3rem; }
  input {
    width: 100%; padding: .7rem; font: inherit; color: inherit;
    background: var(--bg); border: 1px solid var(--line); border-radius: .5rem;
  }
  .panel { background: var(--card); border: 1px solid var(--line);
           border-radius: .6rem; padding: 1rem; margin-bottom: 1rem; }
  [hidden] { display: none !important; }

  /* The shared admin navigation. Links are a thumb's width tall, because
     these pages are opened backstage on a phone with somebody waiting. */
  .adminnav { display: flex; flex-wrap: wrap; gap: .2rem .6rem; align-items: center;
    margin: 0 0 .9rem; }
  .adminnav a { display: inline-flex; align-items: center; min-height: 44px;
    padding: 0 .35rem; color: var(--accent); text-decoration: none; font-size: .95rem; }
  .adminnav a:hover { text-decoration: underline; }
  .adminnav a[aria-current=page] { color: var(--ink); font-weight: 700;
    text-decoration: none; cursor: default; }
  .adminnav .sep { color: var(--muted); }
</style>
</head>
<body>
<main>
  <header>
    <h1>WhatsApp</h1>
    <span class="pill muted" id="bot-pill">Bot: …</span>
    <span class="pill muted" id="web-pill">Web: …</span>
    <button type="button" id="refresh">Refresh</button>
    </header>
    <nav class="adminnav" aria-label="Admin pages">
    <a href="/admin/dashboard">Dashboard</a><span class="sep">·</span>
    <a href="/admin/team">Team passes</a><span class="sep">·</span>
    <a href="/admin/wa" aria-current="page">WhatsApp</a>
  </nav>

  <div class="panel" id="unlock">
    <div class="field">
      <label for="token">Admin token</label>
      <input id="token" type="password" autocomplete="off" spellcheck="false"
             placeholder="paste once, this browser remembers it">
    </div>
    <button type="button" id="unlock-go">Unlock</button>
  </div>

  <div id="app" hidden>
    <nav role="tablist">
      <button type="button" role="tab" data-tab="chats" aria-selected="true">Conversations</button>
      <button type="button" role="tab" data-tab="welcome" aria-selected="false">Welcome</button>
      <button type="button" role="tab" data-tab="questions" aria-selected="false">Unanswered</button>
      <button type="button" role="tab" data-tab="web" aria-selected="false">Web</button>
      <button type="button" role="tab" data-tab="funnel" aria-selected="false">Funnel</button>
    </nav>
    <section id="tab-chats"></section>
    <section id="tab-welcome" hidden></section>
    <section id="tab-questions" hidden></section>
    <section id="tab-web" hidden></section>
    <section id="tab-funnel" hidden></section>
  </div>
</main>

<script>
(function () {
  /* The same key every admin page uses, so one sign-in opens all of them.
     The old key is picked up once and copied across, so nobody has to type
     their token again because of this change. */
  var KEY = 'artindia.team.token';
  var OLD_KEY = 'artindia.wa.adminToken';
  try {
    if (!localStorage.getItem(KEY) && localStorage.getItem(OLD_KEY)) {
      localStorage.setItem(KEY, localStorage.getItem(OLD_KEY));
      localStorage.removeItem(OLD_KEY);
    }
  } catch (e) { /* no storage, so nothing to carry over */ }
  var $ = function (id) { return document.getElementById(id); };
  var data = null;

  function readToken() { try { return localStorage.getItem(KEY) || ''; } catch (e) { return ''; } }
  function writeToken(v) { try { v ? localStorage.setItem(KEY, v) : localStorage.removeItem(KEY); } catch (e) {} }

  /* A view-only token may read the dashboard and nothing else. Rather than
     telling them their token is wrong, which it is not, send them to the one
     page they are allowed. */
  function sendToDashboard(token, otherwise) {
    fetch('/api/dash', { headers: { 'X-Admin-Token': token } })
      .then(function (r) {
        if (r.ok) { location.replace('/admin/dashboard'); return; }
        otherwise();
      })
      .catch(otherwise);
  }


  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = String(text);
    return n;
  }

  /* Everything below builds nodes rather than HTML strings: message text is
     written by strangers on WhatsApp and must never be parsed as markup. */
  function ago(iso) {
    if (!iso) return '';
    var then = new Date(iso);
    if (isNaN(then)) return '';
    var mins = Math.round((Date.now() - then.getTime()) / 60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return mins + ' min ago';
    if (mins < 60 * 24) return Math.round(mins / 60) + ' h ago';
    return then.toLocaleDateString(undefined, { day: 'numeric', month: 'short' })
      + ' ' + then.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
  }

  function empty(msg) { return el('p', 'empty', msg); }

  function renderChats(root) {
    root.innerHTML = '';
    var rows = (data.conversations || []);
    if (!rows.length) { root.appendChild(empty('No conversations yet.')); return; }

    rows.forEach(function (c) {
      var box = el('div', 'row' + (c.needsReply ? ' flag' : ''));
      var det = el('details');
      var sum = el('summary');

      var head = el('div', 'head');
      head.appendChild(el('span', 'who', c.name || c.phone));
      if (c.name) head.appendChild(el('span', 'meta', c.phone));
      head.appendChild(el('span', 'tag' + (c.buyer ? ' buyer' : ''), c.buyer ? 'buyer' : 'prospect'));
      if (c.lang) head.appendChild(el('span', 'tag', c.lang));
      if (c.needsReply) head.appendChild(el('span', 'tag needs', 'needs a look'));
      head.appendChild(el('span', 'meta', ago(c.updatedAt)));
      sum.appendChild(head);

      if (c.last) {
        sum.appendChild(el('div', 'preview',
          (c.last.dir === 'in' ? '← ' : '→ ') + c.last.text));
      }
      det.appendChild(sum);

      var log = el('div', 'log');
      (c.messages || []).forEach(function (m) {
        var line = el('div', 'line ' + (m.dir === 'in' ? 'in' : 'out'));
        var bubble = el('span', 'bubble', m.text);
        line.appendChild(bubble);
        line.appendChild(el('span', 'when',
          (m.dir === 'in' ? 'them' : 'us') + ' · ' + m.kind + ' · ' + ago(m.ts)));
        log.appendChild(line);
      });
      var actions = el('div', 'actions');
      var a = el('a', null, 'Reply to ' + c.phone + ' →');
      a.href = '/admin/reply?to=' + encodeURIComponent(c.phone);
      actions.appendChild(a);
      log.appendChild(actions);
      det.appendChild(log);

      box.appendChild(det);
      root.appendChild(box);
    });
  }

  /* ------------------------------------------------- the welcome backfill */

  /* The job, as the page knows it between batches. It lives on the server;
     this is only what the last answer said. */
  var JOB = null;
  var LOOPING = false;
  /* True between a job finishing and the page reading the counts again. The
     number of buyers still missing is a moment out of date in that window,
     and offering the button again on a stale number is how somebody presses
     it twice. */
  var JUSTFINISHED = false;

  function jobCall(action) {
    return fetch('/api/wa-welcome', {
      method: 'POST',
      headers: { 'X-Admin-Token': readToken(), 'content-type': 'application/json' },
      body: JSON.stringify({ action: action })
    }).then(function (r) { return r.json(); });
  }

  /* One batch at a time, each its own request, because a Worker cannot send
     two hundred messages inside one. Stopping is checked between batches, so
     the most that goes out after a press is the batch already in flight. */
  function pump(action) {
    LOOPING = true;
    paintWelcome();
    jobCall(action).then(function (b) {
      if (!b.ok) {
        LOOPING = false;
        JOB = b.job || JOB;
        paintWelcome(b.error === 'already_running'
          ? 'That job is already running. Press Resume.' : (b.error || 'It did not run.'));
        return;
      }
      JOB = b.job;
      if (JOB.running && JOB.done < JOB.total) { pump('run'); return; }
      LOOPING = false;
      JUSTFINISHED = JOB.done >= JOB.total;
      paintWelcome();
      load();
    }).catch(function () {
      LOOPING = false;
      paintWelcome('Could not reach the server. Nothing was lost: press Resume.');
    });
  }

  function stopJob() {
    jobCall('stop').then(function (b) {
      LOOPING = false;
      JOB = b.job || JOB;
      paintWelcome('Stopped.');
    });
  }

  function backfillBox(missing, note) {
    var box = el('div', 'backfill');
    var job = JOB;
    var busy = Boolean(job && job.running) || LOOPING;

    if (job && job.total) {
      var pct = job.total ? Math.round((job.done / job.total) * 100) : 0;
      box.appendChild(el('div', null,
        job.done + ' of ' + job.total + ' done · ' + job.sent + ' sent'
        + (job.dry_run ? ' · ' + job.dry_run + ' dry run' : '')
        + (job.skipped ? ' · ' + job.skipped + ' skipped' : '')
        + (job.failed ? ' · ' + job.failed + ' failed' : '')));
      var bar = el('div', 'bar');
      var fill = el('i');
      fill.style.width = pct + '%';
      bar.appendChild(fill);
      box.appendChild(bar);
    }

    if (busy) {
      var stop = el('button', null, 'Stop');
      stop.onclick = stopJob;
      box.appendChild(stop);
    } else if (job && job.total && job.done < job.total) {
      var resume = el('button', 'go', 'Resume · ' + (job.total - job.done) + ' left');
      resume.onclick = function () { pump('resume'); };
      box.appendChild(resume);
    } else if (missing > 0 && !JUSTFINISHED) {
      var go = el('button', 'go', 'Send their welcome now');
      go.onclick = function () {
        var what = data.wa_dry_run
          ? 'WA_DRY_RUN is on, so nothing will actually be sent. Run the job over '
            + missing + ' buyer' + (missing === 1 ? '' : 's') + '?'
          : 'Send the welcome message to ' + missing + ' buyer'
            + (missing === 1 ? '' : 's') + ' who never received one?';
        if (window.confirm(what)) pump('start');
      };
      box.appendChild(go);
    }

    if (data.wa_dry_run) box.appendChild(el('span', 'meta', 'WA_DRY_RUN is on'));
    if (note) box.appendChild(el('p', 'note', note));
    else if (job && job.finishedAt && job.total) {
      box.appendChild(el('p', 'note', 'Finished ' + ago(job.finishedAt)
        + (job.by ? ', started by ' + job.by : '') + '.'));
    } else if (missing > 0) {
      box.appendChild(el('p', 'note',
        'They are sent the plain template, in small batches, one at a time. '
        + 'Nobody is sent to twice.'));
    }
    return box;
  }

  /* Redraws only this tab, so a running job updates without pulling the whole
     dashboard down on every batch. */
  function paintWelcome(note) {
    var root = $('tab-welcome');
    if (root && !root.hidden) renderWelcome(root, note);
  }

  function renderWelcome(root, note) {
    root.innerHTML = '';
    var counts = data.welcome_counts || {};
    var health = data.welcome_health || null;
    var missing = Number(data.welcome_missing) || 0;

    /* The alarm, above everything. */
    if (health && health.alarm) {
      var al = el('div', 'alarm');
      al.appendChild(el('b', null, health.failed + ' of the last ' + health.window
        + ' welcome messages failed (' + health.percent + '%)'));
      al.appendChild(el('div', 'why', (health.reasons || []).map(function (r) {
        return [r.code, r.title].filter(Boolean).join(' ') + ' (' + r.count + ')';
      }).join(', ') || 'Meta gave no reason.'));
      root.appendChild(al);
    }

    if (missing > 0 || (JOB && JOB.total)) {
      root.appendChild(el('p', 'who', missing + ' buyer' + (missing === 1 ? '' : 's')
        + ' never received their welcome'));
      root.appendChild(backfillBox(missing, note));
    }

    var wrap = el('div', 'counts');
    [['sent', 'Sent'], ['delivered', 'Delivered'], ['read', 'Read'], ['failed', 'Failed']]
      .forEach(function (pair) {
        var b = el('div', 'count-box');
        b.appendChild(el('b', null, counts[pair[0]] || 0));
        b.appendChild(el('span', null, pair[1]));
        wrap.appendChild(b);
      });
    root.appendChild(wrap);

    var rows = data.welcomes || [];
    if (!rows.length) { root.appendChild(empty('No welcome messages sent yet.')); return; }

    rows.forEach(function (w) {
      var box = el('div', 'row' + (w.status === 'failed' ? ' flag' : ''));
      var head = el('div', 'head');
      head.appendChild(el('span', 'who', w.name || w.phone));
      if (w.name) head.appendChild(el('span', 'meta', w.phone));
      head.appendChild(el('span', 'tag ' + (w.status || ''), w.status || 'sent'));
      head.appendChild(el('span', 'meta', ago(w.ts)));
      box.appendChild(head);

      var bits = [];
      if (w.template) bits.push(w.template);
      if (w.retriedAt) bits.push('sent again ' + ago(w.retriedAt));
      if (w.last_status_ts && w.last_status_ts !== w.ts) bits.push('updated ' + ago(w.last_status_ts));
      if (bits.length) box.appendChild(el('div', 'meta', bits.join(' · ')));

      (w.errors || []).forEach(function (e) {
        box.appendChild(el('div', 'preview', 'Meta ' + e.code + ': ' + e.title));
      });
      root.appendChild(box);
    });
  }

  function renderQuestions(root) {
    root.innerHTML = '';
    var rows = data.questions || [];
    if (!rows.length) { root.appendChild(empty('Nothing unanswered. The FAQ is keeping up.')); return; }

    rows.forEach(function (q) {
      var box = el('div', 'row' + (q.kind === 'escalation' ? ' flag' : ''));
      var head = el('div', 'head');
      head.appendChild(el('span', 'tag' + (q.kind === 'escalation' ? ' needs' : ''),
        q.kind === 'escalation' ? 'wants a person' : 'unanswered'));
      head.appendChild(el('span', 'who', q.name || q.phone));
      if (q.lang) head.appendChild(el('span', 'tag', q.lang));
      head.appendChild(el('span', 'meta', ago(q.at)));
      box.appendChild(head);
      box.appendChild(el('div', 'preview', q.text || q.last_message || ''));

      var actions = el('div', 'actions');
      var a = el('a', null, 'Reply →');
      a.href = '/admin/reply?to=' + encodeURIComponent(q.phone);
      actions.appendChild(a);
      box.appendChild(actions);
      root.appendChild(box);
    });
  }

  function renderWeb(root) {
    root.innerHTML = '';
    var w = data.web || {};
    var wrap = el('div', 'counts');
    [['sessions_today', 'Today'], ['sessions_7d', '7 days'], ['leads', 'Leads'],
     ['buyers', 'Buyers'], ['unanswered', 'Unanswered']].forEach(function (pair) {
      var b = el('div', 'count-box');
      b.appendChild(el('b', null, w[pair[0]] || 0));
      b.appendChild(el('span', null, pair[1]));
      wrap.appendChild(b);
    });
    root.appendChild(wrap);

    var rows = w.sessions || [];
    if (!rows.length) { root.appendChild(empty('No website chats yet.')); return; }

    rows.forEach(function (sn) {
      var box = el('div', 'row' + (sn.lead ? ' flag' : ''));
      var det = el('details');
      var sum = el('summary');
      var head = el('div', 'head');
      head.appendChild(el('span', 'who', sn.state));
      if (sn.lang) head.appendChild(el('span', 'tag', sn.lang));
      if (sn.buyer) head.appendChild(el('span', 'tag buyer', 'buyer'));
      if (sn.lead) head.appendChild(el('span', 'tag needs', 'lead'));
      head.appendChild(el('span', 'meta', sn.count + ' lines'));
      head.appendChild(el('span', 'meta', ago(sn.updatedAt)));
      sum.appendChild(head);
      var last = (sn.messages || [])[sn.messages.length - 1];
      if (last) sum.appendChild(el('div', 'preview', (last.dir === 'in' ? '← ' : '→ ') + last.text));
      det.appendChild(sum);

      var logBox = el('div', 'log');
      (sn.messages || []).forEach(function (m) {
        var line = el('div', 'line ' + (m.dir === 'in' ? 'in' : 'out'));
        line.appendChild(el('span', 'bubble', m.text));
        line.appendChild(el('span', 'when', (m.dir === 'in' ? 'them' : 'Diya') + ' · ' + ago(m.ts)));
        logBox.appendChild(line);
      });
      det.appendChild(logBox);
      box.appendChild(det);
      root.appendChild(box);
    });
  }

  var funnel = null, funnelDays = 7;

  function table(root, title, head, rows) {
    var box = el('div', 'tbl-wrap');
    box.appendChild(el('div', 'tbl-h', title));
    if (!rows.length) { box.appendChild(el('div', 'meta', 'Nothing yet.')); root.appendChild(box); return; }
    var t = el('table');
    var tr = el('tr');
    head.forEach(function (h, i) {
      var th = el('th', i ? 'n' : null, h);
      tr.appendChild(th);
    });
    var thead = el('thead'); thead.appendChild(tr); t.appendChild(thead);
    var tb = el('tbody');
    rows.forEach(function (r) {
      var row = el('tr');
      r.forEach(function (c, i) { row.appendChild(el('td', i ? 'n' : null, c)); });
      tb.appendChild(row);
    });
    t.appendChild(tb);
    box.appendChild(t);
    root.appendChild(box);
  }

  function renderFunnel(root) {
    root.innerHTML = '';

    var range = el('div', 'range');
    [1, 7, 30].forEach(function (n) {
      var b = el('button', null, n === 1 ? 'Today' : n + ' days');
      b.type = 'button';
      b.setAttribute('aria-pressed', String(n === funnelDays));
      b.addEventListener('click', function () { funnelDays = n; loadFunnel(); });
      range.appendChild(b);
    });
    root.appendChild(range);

    if (!funnel) { root.appendChild(empty('Loading…')); return; }

    var v = funnel.visits || {};
    var counts = el('div', 'counts');
    [['Views', v.ok ? v.views : 'n/a'], ['Visitors', v.ok ? v.visitors : 'n/a'],
     ['Clicks', funnel.clicks.total], ['Orders', funnel.orders.total]].forEach(function (pair) {
      var b = el('div', 'count-box');
      b.appendChild(el('b', null, pair[1]));
      b.appendChild(el('span', null, pair[0]));
      counts.appendChild(b);
    });
    root.appendChild(counts);

    if (!v.ok) {
      root.appendChild(el('div', 'row', 'Visits unavailable: ' + (v.reason || 'unknown')
        + '. Set CF_ACCOUNT_ID and CF_ANALYTICS_TOKEN to fill this in.'));
    }

    var r = funnel.ratios || {};
    table(root, 'Ratios', ['Step', '%'], [
      ['Clicks per visit', r.clicks_per_visit == null ? 'n/a' : r.clicks_per_visit + '%'],
      ['Orders per click', r.orders_per_click == null ? 'n/a' : r.orders_per_click + '%'],
      ['Orders per visit', r.orders_per_visit == null ? 'n/a' : r.orders_per_visit + '%'],
    ]);

    table(root, 'Clicks by button', ['CTA', 'Clicks'],
      funnel.clicks.by_cta.map(function (x) { return [x.name, x.count]; }));
    table(root, 'Clicks by language', ['Language', 'Clicks'],
      funnel.clicks.by_lang.map(function (x) { return [x.name, x.count]; }));
    table(root, 'Clicks by source', ['utm_source', 'Clicks'],
      funnel.clicks.by_source.map(function (x) { return [x.name, x.count]; }));

    table(root, 'Orders by tag', ['Tag', 'Orders'],
      funnel.orders.by_tag.map(function (x) { return [x.name, x.count]; })
        .concat([['tagged', funnel.orders.tagged], ['untagged', funnel.orders.untagged]]));

    if (v.ok) {
      table(root, 'Top referrers', ['Host', 'Views'],
        (v.referrers || []).map(function (x) { return [x.host, x.views]; }));
      table(root, 'Visits by day', ['Date', 'Views', 'Visitors'],
        (v.by_day || []).slice().reverse().map(function (x) { return [x.date, x.views, x.visitors]; }));
    }
  }

  function loadFunnel() {
    var token = readToken();
    if (!token) return;
    funnel = null;
    renderFunnel($('tab-funnel'));
    fetch('/api/funnel?days=' + funnelDays, { headers: { 'X-Admin-Token': token } })
      .then(function (r) { return r.json(); })
      .then(function (d) { funnel = d.ok ? d : null; renderFunnel($('tab-funnel')); })
      .catch(function () { $('tab-funnel').innerHTML = ''; $('tab-funnel').appendChild(empty('Could not load the funnel.')); });
  }

  function paint() {
    var pill = $('bot-pill');
    pill.className = 'pill ' + (data.bot_enabled ? 'on' : 'off');
    pill.textContent = 'Bot: ' + (data.bot_enabled ? 'ON' : 'OFF');
    var wp = $('web-pill');
    wp.className = 'pill ' + (data.web_bot_enabled ? 'on' : 'off');
    wp.textContent = 'Web: ' + (data.web_bot_enabled ? 'ON' : 'OFF');
    renderChats($('tab-chats'));
    renderWelcome($('tab-welcome'));
    renderQuestions($('tab-questions'));
    renderWeb($('tab-web'));
    renderFunnel($('tab-funnel'));
  }

  function show(name) {
    ['chats', 'welcome', 'questions', 'web', 'funnel'].forEach(function (n) {
      $('tab-' + n).hidden = n !== name;
    });
    Array.prototype.forEach.call(document.querySelectorAll('nav button'), function (b) {
      b.setAttribute('aria-selected', String(b.dataset.tab === name));
    });
  }

  Array.prototype.forEach.call(document.querySelectorAll('nav button'), function (b) {
    b.addEventListener('click', function () {
      show(b.dataset.tab);
      /* Fetched when it is first looked at, not on every dashboard load: it
         is the one tab that calls out to Cloudflare. */
      if (b.dataset.tab === 'funnel' && !funnel) loadFunnel();
    });
  });

  function load() {
    var token = readToken();
    if (!token) { $('unlock').hidden = false; $('app').hidden = true; return; }

    $('refresh').disabled = true;
    $('refresh').textContent = '…';
    fetch('/api/wa-admin', { headers: { 'X-Admin-Token': token } })
      .then(function (r) { return r.json().then(function (b) { return { status: r.status, body: b }; }); })
      .then(function (r) {
        if (r.status === 401) {
          sendToDashboard(token, function () {
            writeToken('');
            $('unlock').hidden = false;
            $('app').hidden = true;
            $('bot-pill').textContent = 'Token refused';
          });
          return;
        }
        if (r.status !== 200) {
          $('bot-pill').className = 'pill off';
          $('bot-pill').textContent = r.body.error || ('HTTP ' + r.status);
          return;
        }
        data = r.body;
        JUSTFINISHED = false;
        $('unlock').hidden = true;
        $('app').hidden = false;
        paint();
        /* Whether a backfill is half done is one cheap read, and without it
           somebody who closed the tab mid-job has no way back to Resume. */
        if (!LOOPING) {
          jobCall('status').then(function (b) {
            if (b && b.ok) { JOB = b.job; paintWelcome(); }
          }).catch(function () { /* the tab simply shows no job */ });
        }
      })
      .catch(function () {
        $('bot-pill').className = 'pill off';
        $('bot-pill').textContent = 'Offline';
      })
      .then(function () {
        $('refresh').disabled = false;
        $('refresh').textContent = 'Refresh';
      });
  }

  /* A token typed on any admin page lands on the dashboard, which is where
     somebody who has just unlocked the admin area wants to be. */
  $('unlock-go').addEventListener('click', function () {
    var v = $('token').value.trim();
    if (!v) return;
    writeToken(v);
    $('token').value = '';
    location.replace('/admin/dashboard');
  });
  $('refresh').addEventListener('click', load);

  load();
})();
</script>
</body>
</html>
