<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{{TITLE}}</title>
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/diwali.css?v={{CSSV}}">
<style>
/* This page is not part of the site. It has no nav, no footer and no chat
   widget, and it is reached only by a link somebody was sent, so it carries
   its own small sheet on top of the site's tokens rather than adding a
   fourth page shape to diwali.css. */
.tf{max-width:560px;margin:0 auto;padding:clamp(28px,7vw,64px) 20px 80px}
.tf h1{font-size:clamp(26px,6vw,40px);line-height:1.1;margin:0 0 6px}
.tf .tf-team{color:var(--marigold);font-weight:700;letter-spacing:.04em;margin:0 0 18px}
.tf p.tf-intro{color:var(--ink-2);margin:0 0 28px}
.tf fieldset{border:1px solid var(--line);border-radius:12px;padding:16px 16px 4px;margin:0 0 22px;min-width:0}
.tf legend{padding:0 8px;font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--marigold)}
.tf label{display:block;margin:0 0 16px;font-weight:600}
.tf label span{display:block;margin:0 0 6px;font-weight:600}
.tf input[type=text],.tf input[type=email],.tf input[type=tel],.tf select{
  width:100%;box-sizing:border-box;min-width:0;padding:12px 14px;font:inherit;font-weight:400;
  color:inherit;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px}
.tf input:focus-visible,.tf select:focus-visible,.tf button:focus-visible{
  outline:3px solid var(--marigold);outline-offset:2px}
.tf .tf-dob{display:flex;gap:10px}
.tf .tf-dob select{flex:1 1 0}
.tf .tf-why{display:block;margin:-10px 0 16px;font-size:13.5px;font-weight:400;color:var(--ink-2)}
.tf .tf-consent{display:flex;gap:12px;align-items:flex-start;font-weight:400;line-height:1.5}
.tf .tf-consent input{flex:0 0 auto;width:22px;height:22px;margin:2px 0 0}
.tf button{width:100%;padding:16px;font:inherit;font-weight:700;cursor:pointer;
  color:#1b1205;background:var(--marigold);border:0;border-radius:999px}
.tf button[disabled]{opacity:.55;cursor:default}
.tf .tf-note{margin:18px 0 0;padding:14px 16px;border:1px solid var(--line);border-radius:10px}
.tf .tf-note[data-bad=1]{border-color:#b4553f}
.tf .tf-hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
/* At the top, above the title: somebody who opened the link in the wrong
   language should not have to read the whole form to find the way out of it. */
.tf .tf-langs{margin:0 0 20px;font-size:14px;color:var(--ink-2);
  padding-bottom:14px;border-bottom:1px solid var(--line)}
.tf .tf-langs a{color:var(--ink-2)}
.tf .tf-langs a[aria-current=page]{color:var(--marigold);font-weight:700}
</style>
</head>
<body>
<main class="tf" id="team-form">
  <p class="tf-langs">{{LANGS}}</p>
  <h1>{{TITLE}}</h1>
  <p class="tf-team" id="tf-team" hidden></p>
  <p class="tf-intro">{{INTRO}}</p>

  <p class="tf-note" id="tf-boot" hidden></p>

  <form id="tf-form" hidden novalidate>
    <fieldset id="tf-child-set" hidden>
      <legend>{{S_CHILD}}</legend>
      <label><span>{{S_FIRST}}</span><input type="text" name="childFirst" autocomplete="off"></label>
      <label><span>{{S_LAST}}</span><input type="text" name="childLast" autocomplete="off"></label>
      <label><span>{{S_DOB}}</span>
        <span class="tf-dob">
          <select name="dobDay" aria-label="DD"><option value="">DD</option>{{DAYS}}</select>
          <select name="dobMonth" aria-label="MM"><option value="">MM</option>{{MONTHS}}</select>
          <select name="dobYear" aria-label="YYYY"><option value="">YYYY</option>{{YEARS}}</select>
        </span>
      </label>
      <span class="tf-why">{{S_DOB_WHY}}</span>
    </fieldset>

    <fieldset>
      <legend id="tf-person-legend" hidden></legend>
      <label><span>{{S_FIRST}}</span><input type="text" name="firstName" autocomplete="given-name" required></label>
      <label><span>{{S_LAST}}</span><input type="text" name="lastName" autocomplete="family-name" required></label>
      <label><span>{{S_EMAIL}}</span><input type="email" name="email" autocomplete="email" inputmode="email" required></label>
      <label><span>{{S_PHONE}}</span><input type="tel" name="phone" autocomplete="tel" inputmode="tel" required></label>
      <label id="tf-role-label"><span>{{S_ROLE}}</span><input type="text" name="role" autocomplete="off"></label>
    </fieldset>

    <label class="tf-consent">
      <input type="checkbox" name="consent" required>
      <span style="font-weight:400">{{S_CONSENT}}</span>
    </label>

    <p class="tf-hp"><label>Company<input type="text" name="hp" tabindex="-1" autocomplete="off"></label></p>

    <button type="submit" id="tf-submit">{{S_SUBMIT}}</button>
    <p class="tf-note" id="tf-msg" hidden></p>
  </form>

  <p class="tf-note" id="tf-done" hidden>
    <span id="tf-done-text">{{S_RECEIVED}}</span>
    <br><br>
    <button type="button" id="tf-again">{{S_ANOTHER}}</button>
  </p>

</main>
<script>
(function () {
  var LANG = {{LANG_JSON}};
  var KIND = {{KIND_JSON}};
  var S = {{STRINGS_JSON}};
  var k = new URLSearchParams(location.search).get('k') || '';
  var boot = document.getElementById('tf-boot');
  var form = document.getElementById('tf-form');
  var msg = document.getElementById('tf-msg');
  var done = document.getElementById('tf-done');
  var submit = document.getElementById('tf-submit');

  function stop(text) {
    boot.textContent = text;
    boot.dataset.bad = '1';
    boot.hidden = false;
  }

  function show(text, bad) {
    msg.textContent = text;
    msg.hidden = false;
    if (bad) msg.dataset.bad = '1'; else delete msg.dataset.bad;
  }

  if (!k) { stop(S.inactive); return; }

  fetch('/api/team-form?k=' + encodeURIComponent(k) + '&lang=' + LANG)
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (!d || !d.ok) { stop((d && d.strings && d.strings[d.message]) || S.inactive); return; }
      if (d.strings) S = d.strings;
      var team = document.getElementById('tf-team');
      team.textContent = d.label ? d.teamName + ' · ' + d.label : d.teamName;
      team.hidden = false;
      if (d.childTeam) {
        document.getElementById('tf-child-set').hidden = false;
        /* The second block is the parent's, and only the child team has two
           blocks worth naming. */
        var legend = document.getElementById('tf-person-legend');
        legend.textContent = S.parent;
        legend.hidden = false;
      }
      /* The +1 has no act to name: they are somebody's guest. */
      if (!d.needsRole) document.getElementById('tf-role-label').remove();
      boot.hidden = true;
      form.hidden = false;
    })
    .catch(function () { stop(S.error || S.inactive); });

  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var f = new FormData(form);
    var y = f.get('dobYear'), m = f.get('dobMonth'), dd = f.get('dobDay');
    var payload = {
      k: k, lang: LANG,
      firstName: f.get('firstName') || '',
      lastName: f.get('lastName') || '',
      email: f.get('email') || '',
      phone: f.get('phone') || '',
      role: f.get('role') || '',
      consent: form.consent.checked,
      hp: f.get('hp') || ''
    };
    if (!document.getElementById('tf-child-set').hidden) {
      payload.child = {
        firstName: f.get('childFirst') || '',
        lastName: f.get('childLast') || '',
        dob: (y && m && dd) ? (y + '-' + m + '-' + dd) : ''
      };
    }
    submit.disabled = true;
    show(S.submit + '…', false);
    fetch('/api/team-register', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(payload)
    })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        submit.disabled = false;
        if (d && d.ok) {
          form.hidden = true;
          msg.hidden = true;
          document.getElementById('tf-done-text').textContent = S.received;
          done.hidden = false;
          return;
        }
        show((d && (d.text || S[d.message])) || S.error || S.inactive, true);
      })
      .catch(function () { submit.disabled = false; show(S.error || S.inactive, true); });
  });

  /* One link, several people: the lead keeps the page and empties the form.
     A +1 link is for one guest, so it does not come back. */
  document.getElementById('tf-again').addEventListener('click', function () {
    if (KIND === 'plus1') { location.reload(); return; }
    form.reset();
    done.hidden = true;
    msg.hidden = true;
    form.hidden = false;
    form.firstName.focus();
  });
})();
</script>
</body>
</html>
