name: Deploy diwali.artindia.be

# Builds the Diwali site and publishes it to Cloudflare Pages.
#
# artindia.be is NOT deployed here. deploy.sh still handles that, and the
# two must not race each other onto the same account.

on:
  push:
    branches: [main]
    # Only the inputs the Diwali build actually reads. A push that touches
    # nothing on this list does not redeploy the festival site.
    paths:
      - build-diwali.mjs
      - images.mjs
      - data/diwali.json
      - media/**
      - static/**
      - functions/**
      # The bot's knowledge. The build compiles docs/faq.md into the function,
      # so editing the FAQ is a deploy — without this line the new answers
      # would sit in git and never reach the number.
      - docs/faq.md
      # The build copies favicon.svg, og-diwali.png and _redirects out of
      # here, so the share card and the /go/ links count as build inputs.
      - diwali-holding/**
      # The chat widget and the admin pages are copied into the site too. They
      # were missing from this list, so a commit touching only the widget
      # pushed cleanly and deployed nothing.
      - diwali-web/**
      - diwali-admin/**
      - data/partners.json
      # Press coverage. The In the news block on /partners is built from this,
      # so adding a cutting is a deploy.
      - data/news.json
      # The programme pages are generated from this, so editing the running
      # order is a deploy.
      - data/programme.json
  workflow_dispatch:

permissions:
  contents: read

# Deploys queue rather than cancel. A half-finished upload that gets killed
# is worse than waiting for the one in front of it.
concurrency:
  group: deploy-diwali
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # No cache: package-lock.json is gitignored, and setup-node's npm
          # cache needs a lockfile to key on.

      - name: Install dependencies
        run: npm install

      # The ladder, kept between runs. images.mjs already skips any stem whose
      # source still hashes to what the cache recorded, so a hit turns a twelve
      # minute re-encode of every photograph into a few seconds of copying.
      #
      # Keyed on the photographs themselves rather than the commit: adding one
      # picture should re-encode that picture, not all of them. restore-keys
      # takes the newest earlier cache when the key misses, so the new photo is
      # the only work. images.json lives beside the ladder and holds the hash
      # per stem, so both have to travel together or every stem looks stale.
      #
      # The key does not cover images.mjs: the freshness test inside it compares
      # the source photograph's hash, so changing a quality setting or a width
      # would be reused rather than re-encoded. Clear the cache by hand on the
      # day those change.
      - name: Cache the image ladder
        uses: actions/cache@v4
        with:
          path: |
            .cache/img
            .cache/images.json
          key: img-${{ runner.os }}-${{ hashFiles('media/**') }}
          restore-keys: |
            img-${{ runner.os }}-

      # set -e is the default for run steps; it is written out here because
      # a silent build failure would publish a stale or empty dist-diwali.
      - name: Build the site
        shell: bash
        run: |
          set -euo pipefail
          node build-diwali.mjs

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist-diwali --project-name=diwali-2026
